<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Froggy Smart Jumps</title>
    <style>
        :root {
            --bg-color: #0b2e59;
            --water-top: #0077be;
            --water-bottom: #003366;
            --leaf-color: #4caf50;
            --leaf-dark: #2e7d32;
            --text-light: #ffffff;
            --text-dark: #333333;
            --accent: #ffd700;
            --wrong: #ff5252;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-light);
        }

        #environment {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(to bottom, var(--water-top), var(--water-bottom));
            overflow: hidden;
        }

        /* Moving Water Effect */
        .water-wave {
            position: absolute;
            width: 200%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05) 0%, transparent 60%);
            background-size: 100px 100px;
            animation: moveWater 20s linear infinite;
            opacity: 0.5;
        }
        .water-wave:nth-child(2) {
            background-size: 150px 150px;
            animation: moveWater 15s linear infinite reverse;
            opacity: 0.3;
        }

        @keyframes moveWater {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50%, 50%); }
        }

        /* Rain Effect */
        .rain {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="100"><rect x="4" y="0" width="1" height="20" fill="rgba(255,255,255,0.2)"/></svg>');
            animation: rainFall 0.8s linear infinite;
            pointer-events: none;
        }

        @keyframes rainFall {
            0% { background-position: 0 0; }
            100% { background-position: 20px 100vh; }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 20px;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #main-menu, #pause-menu {
            pointer-events: auto;
            text-align: center;
            max-width: 90%;
            width: 400px;
            transform: scale(1);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hidden {
            display: none !important;
            transform: scale(0) !important;
        }

        h1.title {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            color: #a8ff78;
            background: -webkit-linear-gradient(#a8ff78, #78ffd6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            margin-bottom: 30px;
            font-size: 1.1rem;
            color: #ddd;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-light);
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover, .btn:active {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            filter: brightness(1.1);
        }

        .btn.secondary {
            background: linear-gradient(135deg, #ff9800, #f57c00);
        }

        .btn.danger {
            background: linear-gradient(135deg, #f44336, #d32f2f);
        }

        #top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .icon-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            color: white;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: grid;
            gap: 5px;
            padding: 10px;
            padding-top: 80px; /* Space for top controls */
            transition: all 0.5s ease;
        }

        /* Mode Layouts */
        .mode-solo { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .mode-duel { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        .mode-squad { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

        /* General Arena Adjustments for constrained spaces */
        .arena {
            position: relative;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }

        /* Adjustments specific to Squad Mode on Desktop/Tablet to fit everything */
        .mode-squad .arena-view {
            padding-bottom: 5px; /* Kurangi padding bawah */
        }
        
        .mode-squad .frog-container {
            bottom: 30%; /* Turunkan sedikit */
            width: 60px; /* Perkecil katak */
            height: 60px;
        }
        
        .mode-squad .platform {
            bottom: 25%;
            width: 90px;
            height: 30px;
            border-bottom: 5px solid var(--leaf-dark);
        }

        .mode-squad .question-panel {
            width: 95%;
            margin: 0 auto 5px auto; /* Kurangi margin bawah */
        }

        .mode-squad .question-text {
            font-size: clamp(0.8rem, 1.5vmin, 1.1rem); /* Perkecil teks soal */
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 10px;
        }

        .mode-squad .choices-grid {
            gap: 5px; /* Rapatkan tombol */
        }

        .mode-squad .choice-btn {
            padding: 8px 5px;
            font-size: clamp(0.7rem, 1.2vmin, 0.9rem); /* Perkecil teks jawaban */
            border-width: 2px;
            border-radius: 10px;
            box-shadow: 0 2px 0 var(--leaf-dark);
        }
        
        .mode-squad .choice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 var(--leaf-dark);
        }

        /* Mobile Adjustments (Portrait) */
        @media (max-width: 768px) and (orientation: portrait) {
            .mode-duel { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
            .mode-squad { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 1fr 1fr; }
            
            #game-container { 
                padding-top: 60px; 
                overflow-y: auto; /* Allow scrolling if it overflows vertically */
            }
            
            h1.title { font-size: 2rem; }
            
            /* Penyesuaian ukuran di mode potret agar muat */
            .frog-container img { width: 100%; height: 100%; } /* Pertahankan proporsi */
            
            .platform { width: 70px; height: 20px; bottom: 30%; border-bottom-width: 4px; }
            .frog-container { bottom: 35%; width: 45px; height: 45px; }
            
            .question-panel { margin-bottom: 5px; }
            .question-text { font-size: 0.8rem; padding: 6px; margin-bottom: 4px; }
            .choice-btn { padding: 6px 4px; font-size: 0.75rem; border-width: 2px;}
            .arena-view { padding-bottom: 5px; }
            .hud { padding: 8px; }
            .player-tag { font-size: 0.75rem; padding: 3px 6px;}
            .score-box { font-size: 1rem; }
            .streak-box { font-size: 0.8rem; }
        }

        .hud {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
            z-index: 2;
        }

        .player-tag {
            font-weight: bold;
            background: var(--accent);
            color: #000;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .score-box {
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .streak-box {
            color: #ffeb3b;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .arena-view {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20px;
        }

        /* Frog and Platform */
        .frog-container {
            position: absolute;
            bottom: 40%;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .frog-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .platform {
            position: absolute;
            bottom: 35%;
            width: 120px;
            height: 40px;
            background: var(--leaf-color);
            border-radius: 50%;
            border-bottom: 8px solid var(--leaf-dark);
            z-index: 4;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
        }

        .question-panel {
            width: 90%;
            max-width: 600px;
            margin: 0 auto 20px auto;
            text-align: center;
            z-index: 10;
        }

        .question-text {
            font-size: clamp(1rem, 2.5vmin, 1.5rem);
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 15px;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .choice-btn {
            background: rgba(255,255,255,0.9);
            color: var(--text-dark);
            border: 4px solid var(--leaf-dark);
            border-radius: 15px;
            padding: 15px 10px;
            font-size: clamp(0.9rem, 2vmin, 1.2rem);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 0 var(--leaf-dark);
        }

        .choice-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--leaf-dark);
        }

        .choice-btn.correct-anim {
            background: #a8ff78;
            border-color: #4caf50;
            box-shadow: 0 4px 0 #4caf50;
            color: #000;
        }

        .choice-btn.wrong-anim {
            background: var(--wrong);
            border-color: #b71c1c;
            box-shadow: 0 4px 0 #b71c1c;
            color: #fff;
        }

        @keyframes jumpAnim {
            0% { transform: translateY(0) scale(1, 1) rotate(0deg); }
            30% { transform: translateY(-120px) scale(0.8, 1.2) rotate(10deg); }
            50% { transform: translateY(-150px) scale(1.1, 0.9) rotate(-10deg); }
            100% { transform: translateY(0) scale(1, 1) rotate(0deg); }
        }

        @keyframes sinkAnim {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            50% { transform: translateY(50px) scale(0.8) rotate(180deg); opacity: 0.5; }
            100% { transform: translateY(100px) scale(0) rotate(360deg); opacity: 0; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake-effect { animation: shake 0.4s ease-in-out; }
        .jump-effect { animation: jumpAnim 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .sink-effect { animation: sinkAnim 1s ease-in forwards; }

        /* Particle / Floating Score */
        .floating-text {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 20;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }

        .splash {
            position: absolute;
            bottom: 30%;
            width: 100px;
            height: 40px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            opacity: 0;
            z-index: 6;
            pointer-events: none;
        }

        @keyframes splashAnim {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* Game Over Overlay inside Arena */
        .arena-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .arena-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .arena-overlay h2 {
            font-size: 2.5rem;
            color: var(--wrong);
            margin-bottom: 10px;
        }
        
        .timer-bar-container {
            width: 90%;
            height: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
            margin: 10px auto;
            overflow: hidden;
        }
        
        .timer-bar {
            height: 100%;
            width: 100%;
            background: #a8ff78;
            transition: width 0.1s linear, background-color 0.3s;
        }

    </style>
</head>
<body>

    <!-- Environment Background -->
    <div id="environment">
        <div class="water-wave"></div>
        <div class="water-wave"></div>
        <div class="rain"></div>
    </div>

    <!-- Top Global Controls -->
    <div id="top-controls">
        <button class="icon-btn" id="btn-audio" title="Toggle Audio">🔊</button>
        <button class="icon-btn" id="btn-fullscreen" title="Fullscreen">⛶</button>
        <button class="icon-btn hidden" id="btn-home" title="Back to Menu">🏠</button>
    </div>

    <!-- Game Arenas Container -->
    <div id="game-container" class="hidden">
        <!-- Arenas will be injected here by JS -->
    </div>

    <!-- UI Layer (Menus) -->
    <div id="ui-layer">
        
        <!-- Main Menu -->
        <div id="main-menu" class="glass-panel">
            <img src="https://imgur.com/rbdg6rZ.png" alt="Froggy Logo" style="width: 120px; height: auto; margin-bottom: 15px;">
            <h1 class="title">Froggy Smart</h1>
            <p class="subtitle">Lompat, Jawab, dan Jangan Tenggelam!</p>
            
            <button class="btn" onclick="startGame('solo')">👤 Solo Mode (1P)</button>
            <button class="btn secondary" onclick="startGame('duel')">⚔️ Duel Mode (2P)</button>
            <button class="btn danger" onclick="startGame('squad')">🎮 Squad Mode (4P)</button>
            
            <div style="margin-top: 20px; font-size: 0.8rem; color: #aaa;">
                <p>Edukasi Interaktif • Pengetahuan Umum</p>
            </div>
        </div>

    </div>

    <script>
        // --- DATA: Bank Soal (Pengetahuan Umum SMA & Umum) ---
        const questionBank = [
            { q: "Apa ibukota negara Kanada?", c: ["Toronto", "Ottawa", "Vancouver", "Montreal"], a: 1 },
            { q: "Unsur kimia dengan simbol 'O' adalah?", c: ["Osmium", "Oksigen", "Emas", "Perak"], a: 1 },
            { q: "Siapa penemu benua Amerika menurut sejarah barat?", c: ["James Cook", "Vasco da Gama", "Christopher Columbus", "Marco Polo"], a: 2 },
            { q: "Hasil dari 15 x 12 adalah?", c: ["160", "170", "180", "190"], a: 2 },
            { q: "Planet terbesar di tata surya kita?", c: ["Bumi", "Mars", "Saturnus", "Yupiter"], a: 3 },
            { q: "Candi Borobudur terletak di provinsi?", c: ["Jawa Timur", "Jawa Tengah", "DI Yogyakarta", "Bali"], a: 1 },
            { q: "Berapa jumlah provinsi di Indonesia saat ini (2024)?", c: ["34", "38", "33", "36"], a: 1 },
            { q: "Bahasa Inggris dari 'Katak' adalah?", c: ["Toad", "Turtle", "Frog", "Lizard"], a: 2 },
            { q: "Siapa presiden pertama Republik Indonesia?", c: ["Soeharto", "B.J. Habibie", "Megawati", "Soekarno"], a: 3 },
            { q: "Gunung tertinggi di dunia adalah?", c: ["K2", "Gunung Everest", "Gunung Fuji", "Gunung Kilimanjaro"], a: 1 },
            { q: "Benda langit yang mengelilingi planet disebut?", c: ["Bintang", "Meteor", "Satelit", "Komet"], a: 2 },
            { q: "Berapa akar kuadrat dari 144?", c: ["10", "12", "14", "16"], a: 1 },
            { q: "Mata uang negara Jepang adalah?", c: ["Yuan", "Won", "Yen", "Rupee"], a: 2 },
            { q: "Hewan mamalia yang bisa terbang?", c: ["Burung Onta", "Kelelawar", "Tupai", "Pinguin"], a: 1 },
            { q: "Penemu lampu pijar adalah?", c: ["Nikola Tesla", "Albert Einstein", "Thomas Alva Edison", "Isaac Newton"], a: 2 },
            { q: "Samudra terluas di dunia?", c: ["Atlantik", "Hindia", "Pasifik", "Arktik"], a: 2 },
            { q: "Alat pernapasan pada ikan?", c: ["Paru-paru", "Insang", "Trakea", "Kulit"], a: 1 },
            { q: "Apa nama galaksi tempat Bumi berada?", c: ["Andromeda", "Bimasakti", "Sombrero", "Cartwheel"], a: 1 },
            { q: "Senjata khas suku Aborigin di Australia?", c: ["Keris", "Katana", "Bumerang", "Sumpit"], a: 2 },
            { q: "Ibukota provinsi Sumatera Utara?", c: ["Padang", "Palembang", "Pekanbaru", "Medan"], a: 3 }
        ];

        // --- AUDIO SYNTHESIS ENGINE (No external files) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioEnabled = true;

        const SoundEngine = {
            playTone: function(freq, type, duration, vol=0.1, slideFreq=null) {
                if (!audioEnabled || audioCtx.state === 'suspended') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                if (slideFreq) {
                    osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
                }

                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            },
            jump: () => SoundEngine.playTone(300, 'sine', 0.4, 0.2, 800),
            correct: () => {
                SoundEngine.playTone(440, 'square', 0.1, 0.05); // A4
                setTimeout(() => SoundEngine.playTone(554.37, 'square', 0.1, 0.05), 100); // C#5
                setTimeout(() => SoundEngine.playTone(659.25, 'square', 0.3, 0.05), 200); // E5
            },
            wrong: () => SoundEngine.playTone(150, 'sawtooth', 0.5, 0.2, 50),
            splash: () => {
                // Noise burst for water splash
                if (!audioEnabled) return;
                const bufferSize = audioCtx.sampleRate * 0.5; // 0.5 seconds
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1; // White noise
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 800;
                const gain = audioCtx.createGain();
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                
                noise.start();
            },
            click: () => SoundEngine.playTone(800, 'sine', 0.1, 0.1)
        };

        // --- GLOBAL CONTROLS SETUP ---
        const btnAudio = document.getElementById('btn-audio');
        btnAudio.addEventListener('click', () => {
            audioEnabled = !audioEnabled;
            btnAudio.innerHTML = audioEnabled ? '🔊' : '🔇';
            if (audioEnabled && audioCtx.state === 'suspended') audioCtx.resume();
            SoundEngine.click();
        });

        const btnFullscreen = document.getElementById('btn-fullscreen');
        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                btnFullscreen.innerHTML = '⛟';
            } else {
                document.exitFullscreen();
                btnFullscreen.innerHTML = '⛶';
            }
            SoundEngine.click();
        });

        const btnHome = document.getElementById('btn-home');
        btnHome.addEventListener('click', () => {
            SoundEngine.click();
            resetGame();
        });

        // --- GAME LOGIC & CLASSES ---
        
        let arenas = [];
        let gameMode = 'solo';
        const QUESTION_TIME_LIMIT = 15; // seconds

        class PlayerArena {
            constructor(id, colorName, container) {
                this.id = id;
                this.name = `Player ${id}`;
                this.colorName = colorName;
                this.container = container;
                this.score = 0;
                this.streak = 0;
                this.isAlive = true;
                this.currentQuestion = null;
                this.timer = QUESTION_TIME_LIMIT;
                this.timerInterval = null;
                
                this.initDOM();
                this.loadNextQuestion();
            }

            initDOM() {
                this.el = document.createElement('div');
                this.el.className = 'arena';
                this.el.innerHTML = `
                    <div class="hud">
                        <div class="player-tag" style="background:${this.colorName}">${this.name}</div>
                        <div class="streak-box" id="streak-${this.id}">🔥 Combo x0</div>
                        <div class="score-box" id="score-${this.id}">0</div>
                    </div>
                    
                    <div class="timer-bar-container">
                        <div class="timer-bar" id="timer-${this.id}"></div>
                    </div>

                    <div class="arena-view" id="view-${this.id}">
                        <div class="platform" id="platform-${this.id}"></div>
                        <div class="frog-container" id="frog-${this.id}"><img src="https://i.imgur.com/aWvYyBp.png" alt="Frog"></div>
                        <div class="splash" id="splash-${this.id}"></div>
                    </div>

                    <div class="question-panel" id="qpanel-${this.id}">
                        <div class="question-text" id="qtext-${this.id}">Memuat Soal...</div>
                        <div class="choices-grid" id="choices-${this.id}">
                            <!-- Buttons injected here -->
                        </div>
                    </div>

                    <div class="arena-overlay" id="overlay-${this.id}">
                        <h2>GAME OVER</h2>
                        <p>Skor Akhir: <span id="final-score-${this.id}">0</span></p>
                        <button class="btn" style="width:200px; margin-top:20px;" onclick="arenas[${this.id-1}].restart()">Main Lagi</button>
                    </div>
                `;
                this.container.appendChild(this.el);

                // Cache DOM elements
                this.domScore = this.el.querySelector(`#score-${this.id}`);
                this.domStreak = this.el.querySelector(`#streak-${this.id}`);
                this.domQText = this.el.querySelector(`#qtext-${this.id}`);
                this.domChoices = this.el.querySelector(`#choices-${this.id}`);
                this.domFrog = this.el.querySelector(`#frog-${this.id}`);
                this.domOverlay = this.el.querySelector(`#overlay-${this.id}`);
                this.domFinalScore = this.el.querySelector(`#final-score-${this.id}`);
                this.domArenaView = this.el.querySelector(`#view-${this.id}`);
                this.domTimer = this.el.querySelector(`#timer-${this.id}`);
            }

            loadNextQuestion() {
                if (!this.isAlive) return;

                // Pick random question
                const randIndex = Math.floor(Math.random() * questionBank.length);
                this.currentQuestion = questionBank[randIndex];

                this.domQText.innerText = this.currentQuestion.q;
                this.domChoices.innerHTML = '';

                this.currentQuestion.c.forEach((choiceText, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    // Labels A, B, C, D
                    const label = String.fromCharCode(65 + index);
                    btn.innerHTML = `<b>${label}.</b> ${choiceText}`;
                    btn.onclick = () => this.checkAnswer(index, btn);
                    this.domChoices.appendChild(btn);
                });

                this.resetTimer();
            }

            resetTimer() {
                clearInterval(this.timerInterval);
                this.timer = QUESTION_TIME_LIMIT;
                this.updateTimerUI();

                this.timerInterval = setInterval(() => {
                    if (!this.isAlive) {
                        clearInterval(this.timerInterval);
                        return;
                    }
                    this.timer -= 0.1;
                    this.updateTimerUI();

                    if (this.timer <= 0) {
                        clearInterval(this.timerInterval);
                        this.handleWrongAnswer(null); // Time out counts as wrong
                    }
                }, 100);
            }

            updateTimerUI() {
                const percentage = Math.max(0, (this.timer / QUESTION_TIME_LIMIT) * 100);
                this.domTimer.style.width = `${percentage}%`;
                
                if (percentage > 50) this.domTimer.style.backgroundColor = '#a8ff78';
                else if (percentage > 20) this.domTimer.style.backgroundColor = '#ffeb3b';
                else this.domTimer.style.backgroundColor = '#ff5252';
            }

            checkAnswer(selectedIndex, btnElement) {
                if (!this.isAlive) return;
                clearInterval(this.timerInterval);

                // Disable all buttons to prevent double clicking
                Array.from(this.domChoices.children).forEach(b => b.style.pointerEvents = 'none');

                if (selectedIndex === this.currentQuestion.a) {
                    // CORRECT
                    btnElement.classList.add('correct-anim');
                    this.handleCorrectAnswer();
                } else {
                    // WRONG
                    btnElement.classList.add('wrong-anim');
                    
                    // Highlight correct answer
                    const correctBtn = this.domChoices.children[this.currentQuestion.a];
                    if(correctBtn) correctBtn.classList.add('correct-anim');
                    
                    this.handleWrongAnswer();
                }
            }

            handleCorrectAnswer() {
                SoundEngine.jump();
                setTimeout(() => SoundEngine.correct(), 300);

                this.streak++;
                const points = 10 * this.streak;
                this.score += points;
                
                this.domScore.innerText = this.score;
                
                if (this.streak > 1) {
                    this.domStreak.innerText = `🔥 Combo x${this.streak}`;
                    this.domStreak.style.opacity = 1;
                }

                // Floating Text Effect
                this.showFloatingText(`+${points}`);

                // Jump Animation
                this.domFrog.classList.remove('jump-effect');
                void this.domFrog.offsetWidth; // trigger reflow
                this.domFrog.classList.add('jump-effect');

                // Load next question after animation
                setTimeout(() => {
                    this.loadNextQuestion();
                }, 600);
            }

            handleWrongAnswer() {
                this.isAlive = false;
                this.streak = 0;
                
                SoundEngine.wrong();
                setTimeout(() => SoundEngine.splash(), 400);

                this.el.classList.add('shake-effect');
                
                // Sink Animation
                this.domFrog.classList.add('sink-effect');
                
                // Splash Effect
                const splash = this.el.querySelector(`#splash-${this.id}`);
                splash.style.animation = 'none';
                void splash.offsetWidth;
                splash.style.animation = 'splashAnim 0.6s ease-out forwards';

                setTimeout(() => {
                    this.showGameOver();
                }, 1200);
            }

            showFloatingText(text) {
                const floatEl = document.createElement('div');
                floatEl.className = 'floating-text';
                floatEl.innerText = text;
                // Position roughly above frog
                floatEl.style.bottom = '50%';
                floatEl.style.left = '50%';
                floatEl.style.transform = 'translateX(-50%)';
                this.domArenaView.appendChild(floatEl);

                setTimeout(() => {
                    floatEl.remove();
                }, 1000);
            }

            showGameOver() {
                this.domFinalScore.innerText = this.score;
                this.domOverlay.classList.add('active');
            }

            restart() {
                this.isAlive = true;
                this.score = 0;
                this.streak = 0;
                this.domScore.innerText = '0';
                this.domStreak.style.opacity = 0;
                
                this.domFrog.classList.remove('sink-effect', 'jump-effect');
                this.el.classList.remove('shake-effect');
                this.domOverlay.classList.remove('active');
                
                this.loadNextQuestion();
            }
            
            destroy() {
                clearInterval(this.timerInterval);
                this.el.remove();
            }
        }

        // --- MAIN GAME FLOW MANAGER ---
        
        const menuLayer = document.getElementById('main-menu');
        const gameContainer = document.getElementById('game-container');
        const uiLayer = document.getElementById('ui-layer');

        function startGame(mode) {
            SoundEngine.click();
            // Need user interaction to unlock audio context in browsers
            if (audioCtx.state === 'suspended') audioCtx.resume();

            gameMode = mode;
            menuLayer.classList.add('hidden');
            uiLayer.style.pointerEvents = 'none'; // allow clicking through
            gameContainer.classList.remove('hidden');
            btnHome.classList.remove('hidden');

            setupArenas(mode);
        }

        function setupArenas(mode) {
            // Clear existing
            arenas.forEach(a => a.destroy());
            arenas = [];
            gameContainer.innerHTML = '';
            
            // Reset grid classes
            gameContainer.className = `mode-${mode}`;

            let playerCount = 1;
            if (mode === 'duel') playerCount = 2;
            if (mode === 'squad') playerCount = 4;

            const colors = ['#ffd700', '#03a9f4', '#e91e63', '#9c27b0'];

            for (let i = 1; i <= playerCount; i++) {
                arenas.push(new PlayerArena(i, colors[i-1], gameContainer));
            }
        }

        function resetGame() {
            arenas.forEach(a => a.destroy());
            arenas = [];
            gameContainer.classList.add('hidden');
            gameContainer.className = '';
            btnHome.classList.add('hidden');
            
            menuLayer.classList.remove('hidden');
            uiLayer.style.pointerEvents = 'auto';
        }

        // Initialize Audio on first interaction to comply with autoplay policies
        document.body.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }, { once: true });

    </script>
</body>
</html>
